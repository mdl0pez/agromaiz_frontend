<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroBot — Asistente IA | AgroMaíz</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/asistente.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════════
    PANTALLA PRINCIPAL DEL CHAT
═══════════════════════════════════════════════ -->
<div class="chat-layout">

  <!-- HEADER -->
  <header class="chat-header">
    <a href="#" class="chat-header-back" aria-label="Volver" onclick="history.length > 1 ? history.back() : window.location.href='dashboard.html'; return false;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </a>

    <div class="chat-bot-avatar" aria-hidden="true">🌽</div>

    <div class="chat-header-info">
      <h2>AgroBot</h2>
      <div class="chat-status">
        <span class="chat-status-dot"></span>
        <span>Asistente agronómico IA</span>
      </div>
    </div>

    <!-- Selector de proveedor -->
    <button class="provider-badge" id="providerBadge" aria-label="Cambiar proveedor de IA">
      <span class="pb-dot"></span>
      Cargando…
    </button>
  </header>


  <!-- ÁREA DE MENSAJES -->
  <section class="chat-messages" id="chatMessages" aria-live="polite" aria-label="Conversación">

    <!-- Banner de contexto del cultivo -->
    <div class="context-banner" id="contextBanner">
      <h3>🌽 Tu cultivo registrado</h3>
      <div class="context-tags" id="contextTags">
        <!-- Tags inyectados por JS -->
      </div>
    </div>

    <!-- Sugerencias iniciales -->
    <div class="suggestions-wrap" id="suggestionsWrap">
      <p class="suggestions-title">Preguntas frecuentes</p>
      <div class="suggestions-row" id="suggestionsRow">
        <!-- Chips inyectados por JS -->
      </div>
    </div>

    <!-- Los mensajes se insertan aquí dinámicamente -->

    <!-- Indicador de escritura (siempre al final) -->
    <div class="typing-indicator" id="typingIndicator">
      <div class="msg-avatar" aria-hidden="true">🌱</div>
      <div class="typing-dots" aria-label="AgroBot está escribiendo">
        <span></span><span></span><span></span>
      </div>
    </div>

  </section>


  <!-- INPUT AREA -->
  <footer class="chat-input-area">
    <div class="chat-input-row">
      <div class="chat-input-wrap">
        <textarea
          id="chatInput"
          rows="1"
          placeholder="Pregunta sobre tu cultivo…"
          aria-label="Escribe tu pregunta"
          autocomplete="off"
          autocorrect="on"
          spellcheck="true"
        ></textarea>
      </div>
      <button class="chat-send-btn" id="sendBtn" aria-label="Enviar mensaje">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4 20-7z"/>
          <path d="M22 2 11 13"/>
        </svg>
      </button>
    </div>
    <p class="chat-disclaimer">
      AgroBot puede cometer errores. Consulta siempre a un ingeniero agrónomo para decisiones importantes.
    </p>
  </footer>

</div><!-- /.chat-layout -->

<!-- ═══════════════════════════════════════════════
     GUARDAR DATOS DEL WIZARD EN localStorage
     (Agrega esto al final de registrar-cultivo.js
      cuando el usuario finalice el registro)
═══════════════════════════════════════════════ -->
<script>
/*
  INSTRUCCIÓN PARA INTEGRAR EL WIZARD:
  En registrar-cultivo.js, dentro del setTimeout del botón "Finalizar",
  agrega este bloque ANTES de redirigir:

  const form = document.getElementById('wizardForm');
  const datos = {
    departamento:  form.querySelector('[name="departamento"]')?.value || '',
    fecha_siembra: form.querySelector('[name="fecha_siembra"]')?.value || '',
    manejo:        form.querySelector('[name="manejo"]:checked')?.value || '',
    analisis:      form.querySelector('[name="analisis"]:checked')?.value || '',
    tipo_suelo:    form.querySelector('[name="tipo_suelo"]:checked')?.value || '',
    ph:            form.querySelector('[name="ph"]:checked')?.value || '',
  };
  localStorage.setItem('agromaiz_cultivo', JSON.stringify(datos));
*/
</script>

<script src="../js/config.js"></script>
  <script src="../js/api.js"></script>  
<script>                              
  requireAuth();
  const u = Auth.getUsuario();
  if (u) document.querySelectorAll('.usuario-nombre').forEach(el => el.textContent = u.nombre);
</script>
<script src="../js/asistente.js"></script>

</body>
</html>
