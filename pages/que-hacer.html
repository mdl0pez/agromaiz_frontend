<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Qué hacer hoy? — AgroMaíz</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app-layout">

  <div class="app-container" style="padding-bottom: 100px;">
    <header class="app-header">
      <a href="dashboard.html" class="app-header-back" aria-label="Volver">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="app-header-title">🌱 ¿Qué hacer hoy?</div>
      <div style="width:24px"></div>
    </header>

    <main>
      <!-- Fecha dinámica -->
      <div class="date-header" id="fecha-hoy">📅 Cargando…</div>

      <!-- Badge de etapa -->
      <div id="etapa-badge" style="display:none; margin-bottom:1rem;">
        <span id="etapa-badge-text" style="
          display:inline-flex; align-items:center; gap:.4rem;
          background:var(--green-700); color:#fff;
          font-size:.75rem; font-weight:700;
          padding:.3rem .85rem; border-radius:99px;
          letter-spacing:.04em;
        "></span>
        <span id="dias-badge" style="
          font-size:.72rem; color:var(--gray-500); margin-left:.5rem;
        "></span>
      </div>

      <!-- Recomendación principal -->
      <div class="main-rec-card" id="rec-card">
        <div style="font-size:1.5rem" id="rec-icon">🌿</div>
        <div style="flex:1">
          <h3>Recomendación principal</h3>
          <p id="rec-texto">Cargando recomendación…</p>
        </div>
        <div style="color:#166534;font-size:1.5rem;display:flex;align-items:center">›</div>
      </div>

      <h2 class="tasks-title">Tareas sugeridas para hoy</h2>

      <!-- Tareas dinámicas -->
      <div id="tareas-lista"></div>

      <!-- Tarjeta de etapa -->
      <div class="status-card" id="status-etapa">
        <div class="icon" style="font-size:2rem" id="etapa-icon">🌱</div>
        <div>
          <h4>Etapa actual del cultivo</h4>
          <p id="etapa-desc" style="font-size:.85rem;color:var(--gray-600);margin-top:.2rem">Cargando…</p>
        </div>
      </div>

      <!-- Sin cultivo registrado -->
      <div id="sin-cultivo" style="display:none; text-align:center; padding:2rem 1rem;
           background:var(--gray-50); border-radius:var(--radius-md);
           border:1px dashed var(--gray-300); margin-top:1rem;">
        <p style="font-size:2rem; margin-bottom:.5rem">🌽</p>
        <p style="font-weight:700; color:var(--green-900); margin-bottom:.3rem">No tienes un cultivo registrado</p>
        <p style="font-size:.85rem; color:var(--gray-600); margin-bottom:1rem">
          Registra tu cultivo para recibir recomendaciones personalizadas.
        </p>
        <a href="registrar-cultivo.html" class="btn-primary" style="display:inline-flex;font-size:.9rem;">
          Registrar cultivo
        </a>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Inicio</span>
    </a>
    <a href="aprender.html" class="nav-item">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Aprender</span>
    </a>
    <a href="perfil.html" class="nav-item">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="usuario-nombre">Perfil</span>
    </a>
    <button onclick="Auth.cerrarSesion()" class="nav-item" style="background:none;border:none;cursor:pointer;">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Salir</span>
    </button>
  </nav>

  <a href="asistente.html" class="chat-fab" aria-label="Abrir AgroBot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span class="chat-fab-pulse"></span>
  </a>
  <link rel="stylesheet" href="../css/asistente.css" />

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/cultivo-utils.js"></script>
  <script>
    requireAuth();
    const u = Auth.getUsuario();
    if (u) document.querySelectorAll('.usuario-nombre').forEach(el => el.textContent = u.nombre);

    // Fecha de hoy
    document.getElementById('fecha-hoy').textContent = '📅 ' + CultivoUtils.fechaHoyEspanol();

    // ── Las 4 tareas fijas con descripciones dinámicas por etapa ──────────
    // Cada tarea siempre aparece y siempre enlaza a su página.
    // Solo cambia el texto descriptivo según la etapa del cultivo.
    const TAREAS_FIJAS = [
      {
        id:    'fertilizacion',
        icon:  '🌱',
        titulo: 'Fertilización',
        href:  'fertilizacion.html',
        desc: {
          siembra:             'Aún no es momento de fertilizar. Espera a la etapa V3–V4.',
          vegetativo_temprano: 'Primera aplicación de nitrógeno (Urea o DAP). Etapa ideal ahora.',
          vegetativo_medio:    'Considera una segunda aplicación de nitrógeno si el cultivo lo requiere.',
          prefloracion:        'Aplicación foliar si observas carencias nutricionales.',
          floracion:           'No apliques fertilizantes granulados. Prioriza el riego.',
          llenado:             'El llenado del grano ya no responde a fertilización en este ciclo.',
          madurez:             'No se aplica fertilizante. Prepara la cosecha.',
          _default:            'Aplica fertilizante según la etapa actual de tu cultivo.',
        },
      },
      {
        id:    'riego',
        icon:  '💧',
        titulo: 'Riego',
        href:  'riego.html',
        desc: {
          siembra:             'Verifica que el suelo mantenga humedad suficiente para la germinación.',
          vegetativo_temprano: 'Mantén humedad óptima para favorecer el desarrollo vegetativo.',
          vegetativo_medio:    'Riego ligero en la tarde para mantener humedad óptima.',
          prefloracion:        'Agua abundante antes de la floración. No dejes secar el suelo.',
          floracion:           'La floración requiere máxima disponibilidad de agua. Riega a diario.',
          llenado:             'Mantén humedad para maximizar el llenado del grano.',
          madurez:             'Reduce el riego gradualmente. El grano está completando su madurez.',
          _default:            'Riega según la etapa y el tipo de suelo registrado.',
        },
      },
      {
        id:    'monitoreo',
        icon:  '🔍',
        titulo: 'Monitoreo de plagas',
        href:  'monitoreo.html',
        desc: {
          siembra:             'Comprueba que el porcentaje de emergencia sea superior al 85%.',
          vegetativo_temprano: 'Revisa hojas inferiores en busca de gusano cogollero o pulgones.',
          vegetativo_medio:    'Revisar hojas inferiores en busca de plagas comunes.',
          prefloracion:        'Inspección de plagas que puedan afectar las espigas.',
          floracion:           'Plagas que dañen las espigas o sedas afectan el rendimiento.',
          llenado:             'Inspecciona mazorcas por hongos o daño de insectos.',
          madurez:             'Verifica el punto negro del grano y el nivel de humedad (≤25%).',
          _default:            'Inspecciona el cultivo para detectar plagas o enfermedades.',
        },
      },
      {
        id:    'malezas',
        icon:  '🌿',
        titulo: 'Revisión de malezas',
        href:  'malezas.html',
        desc: {
          siembra:             'Elimina malezas antes de que compitan con las plántulas emergentes.',
          vegetativo_temprano: 'Controla malezas antes de que superen 10 cm de altura.',
          vegetativo_medio:    'Verifica presencia de malezas y controlarlas si es necesario.',
          prefloracion:        'Elimina malezas que compitan por agua y nutrientes antes de florecer.',
          floracion:           'Mantén el área limpia para no interferir con la polinización.',
          llenado:             'Controla malezas tardías que puedan dificultar la cosecha.',
          madurez:             'Despeja el área para facilitar la entrada de maquinaria de cosecha.',
          _default:            'Revisa y controla malezas según el estado del cultivo.',
        },
      },
    ];

    (async () => {
      try {
        const { ok, datos } = await CultivoService.obtener();
        const cultivo = (ok && datos?.cultivo) ? datos.cultivo : null;

        if (!cultivo) {
          document.getElementById('sin-cultivo').style.display  = 'block';
          document.getElementById('rec-card').style.display     = 'none';
          document.getElementById('status-etapa').style.display = 'none';
          document.querySelector('.tasks-title').style.display  = 'none';
          return;
        }

        const { dias, etapa } = CultivoUtils.calcular(cultivo);

        // Badge de etapa
        document.getElementById('etapa-badge').style.display    = 'block';
        document.getElementById('etapa-badge-text').textContent = `${etapa.emoji} ${etapa.nombre}`;
        document.getElementById('dias-badge').textContent       = `· Día ${dias} desde siembra`;

        // Recomendación principal
        document.getElementById('rec-icon').textContent  = etapa.emoji;
        document.getElementById('rec-texto').textContent = etapa.recomendacion_principal;

        // Status card
        document.getElementById('etapa-icon').textContent = etapa.emoji;
        document.getElementById('etapa-desc').innerHTML   =
          `${etapa.nombre}<br>(${etapa.codigo} — día ${dias})`;

        // ── Renderizar las 4 tareas fijas ──────────────────
        const lista = document.getElementById('tareas-lista');
        lista.innerHTML = ''; // limpiar por si se recarga

        TAREAS_FIJAS.forEach(tarea => {
          const desc = tarea.desc[etapa.id] || tarea.desc._default;
          const el   = document.createElement('a');
          el.href      = tarea.href;
          el.className = 'task-item';
          el.innerHTML = `
            <div class="icon">${tarea.icon}</div>
            <div class="content">
              <h4>${tarea.titulo}</h4>
              <p>${desc}</p>
            </div>
            <div class="task-arrow">›</div>`;
          lista.appendChild(el);
        });

      } catch (err) {
        console.error('Error cargando cultivo:', err);
        document.getElementById('rec-texto').textContent =
          'No se pudieron cargar las recomendaciones. Intenta de nuevo.';
      }
    })();
  </script>
</body>
</html>
